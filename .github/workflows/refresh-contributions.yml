# 매일 공개 기여 달력을 다시 읽어 히어로 배너(달력 입자 · 기여 수 캡션)를 갱신한다.
name: refresh-contributions

on:
  schedule:
    - cron: "17 15 * * *"  # 매일 00:17 KST
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: profile-render
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Fetch calendar and render
        run: |
          python scripts/fetch_contributions.py
          python scripts/render_cards.py

      - name: Commit if changed
        run: |
          git add data assets
          if git diff --cached --quiet; then echo "no change"; exit 0; fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "chore: 기여 달력 갱신"
          git pull --rebase
          git push
