# 매일 공개 기여 달력과 광주 날씨를 다시 읽어 히어로 배너 · 인사말을 갱신한다.
name: refresh-contributions

on:
  schedule:
    - cron: "17 15 * * *"  # 매일 00:17 KST
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: profile-render
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      # 날씨는 실패해도 계속 — 인사말이 날씨 없이 요일 인사로 나간다
      - name: Fetch calendar and weather, then render
        run: |
          python scripts/fetch_contributions.py
          python scripts/fetch_weather.py || echo "weather skipped"
          python scripts/render_cards.py

      - name: Commit if changed
        run: |
          git add data assets
          if git diff --cached --quiet; then echo "no change"; exit 0; fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "chore: 기여 달력 갱신"
          git pull --rebase
          git push
