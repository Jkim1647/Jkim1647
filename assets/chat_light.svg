<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="328" viewBox="0 0 1200 328" role="img" aria-label="안녕하세요, 김진영입니다 👋 / 오늘 광주는 🌤️ 구름 조금, 낮 최고 17°C예요. 좋은 목요일 보내세요! / 현대자동차그룹 시스템을 3년 운영하다가, 지금은 백엔드 · AI를 만들고 있어요 / 어떤 분이신가요? 아래에서 골라 주시면 바로 안내할게요 👇">
<style>.m,.ty{opacity:0;animation-fill-mode:both;animation-timing-function:cubic-bezier(.2,.9,.3,1.2)}@keyframes pop{from{opacity:0;transform:translateY(10px) scale(.96)}to{opacity:1;transform:none}}@keyframes typing{0%{opacity:0}10%,90%{opacity:1}100%{opacity:0}}@keyframes dot{0%,60%,100%{transform:none}30%{transform:translateY(-4px)}}.dt{animation:dot .9s ease-in-out infinite}@media (prefers-reduced-motion:reduce){.m{animation:none!important;opacity:1}.ty{display:none}}</style>
