<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="482" viewBox="0 0 1200 482" role="img" aria-label="SafeLaw 파이프라인: 1. 외부 모델 호출 전 로컬에서 이름 · 전화번호 · 주소 등을 플레이스홀더로 바꾸고 원문과 매핑은 저장하지 않는다. 2. 일상 표현을 법률 용어로 바꾸고 원문 질문과 함께 검색한다. 3. 법령 381개 조문과 판례 50건을 Chroma에서 찾는다. 4. LangGraph로 답하고 인용 문구가 원문에 그대로 있는지 확인해, 확인되지 않으면 답하지 않는다.">
